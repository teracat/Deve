apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Values.namespace.name | quote }}
data:
  otel-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:{{ .Values.otelCollector.portGrpc }}
          http:
            endpoint: 0.0.0.0:{{ .Values.otelCollector.portHttp }}

    processors:
      batch:

    exporters:
      zipkin:
        endpoint: http://zipkin.{{ .Values.namespace.name }}.svc.cluster.local:{{ .Values.zipkin.port }}/api/v2/spans

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [zipkin]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace.name | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector:0.149.0
          args:
            - "--config=/etc/otel/otel-config.yaml"
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.otelCollector.portGrpc }}
            - name: otlp-http
              containerPort: {{ .Values.otelCollector.portHttp }}
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config

---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace.name | quote }}
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: {{ .Values.otelCollector.portGrpc }}
      targetPort: {{ .Values.otelCollector.portGrpc }}
    - name: otlp-http
      port: {{ .Values.otelCollector.portHttp }}
      targetPort: {{ .Values.otelCollector.portHttp }}
