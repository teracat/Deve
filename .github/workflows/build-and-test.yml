name: Build and Test

on:
  workflow_call:
    inputs:
      solution:
        description: "The solution to build and test"
        type: string
        required: true
      installMauiWorkload:
        description: "Install MAUI workload"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 #v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Set up dependency caching for faster builds
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  #v5.0.5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore workloads
      run: dotnet workload restore ${{ inputs.solution }}

    - name: Install MAUI workloads (conditional)
      if: ${{ inputs.installMauiWorkload }}
      run: dotnet workload install maui

    - name: Restore dependencies
      run: dotnet restore ${{ inputs.solution }}

    - name: Build
      run: dotnet build --no-restore ${{ inputs.solution }}

    - name: Test
      run: dotnet test --no-build --verbosity detailed ${{ inputs.solution }}
